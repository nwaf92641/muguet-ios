name: build-ios

on:
  workflow_dispatch

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Setup Rust toolchain
        run: |
          rustup toolchain install 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1

      - name: Fix all Launcher.swift syntax issues
        run: |
          python3 -c "
          path = 'ios/Launcher.swift'
          with open(path, 'r') as f:
              content = f.read()
          content = content.replace('.glassProminent', '.borderedProminent')
          with open(path, 'w') as f:
              f.write(content)
          "

      - name: Build IPA
        run: BUNDLE_ID=com.kestrel4829.muguet ./make-ios.sh --ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Muguet Build #${{ github.run_number }}
          files: build/Muguet.ipa
          body: "ملف IPA مكتمل ومستقر للتحميل والتثبيت المباشر على الآيباد."

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muguet
          path: build/Muguet.ipa
